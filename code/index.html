

<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="libraries/p5.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/generative-design/Code-Package-p5.js@master/libraries/gg-dep-bundle/gg-dep-bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/0.7.3/opentype.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />

  </head>
  <body>
    <main>
      <details class="glyph-picker" aria-label="Choose a glyph" open>
        <summary class="glyph-picker__title menu-toggle">GLYPHS</summary>
        <label id="font-dropzone" class="font-picker" for="font-upload">
          <span>Drop a .ttf or .otf here, or browse</span>
          <input id="font-upload" type="file" accept=".ttf,.otf,font/ttf,font/otf">
        </label>
        <p id="font-status" class="font-picker__status" role="status" aria-live="polite"></p>
        <div id="glyph-buttons" class="glyph-picker__grid" role="group" aria-label="Font glyphs"></div>
      </details>
      <details class="appearance-controls" aria-label="Appearance">
        <summary class="appearance-controls__title menu-toggle">APPEARANCE</summary>
        <div class="appearance-controls__fields">
          <label class="appearance-controls__field" for="background-color">
            <span>Background</span>
            <input id="background-color" type="color" value="#dcdcdc">
          </label>
          <label class="appearance-controls__field" for="line-color">
            <span>Lines / vertices</span>
            <input id="line-color" type="color" value="#ff0000">
          </label>
          <label class="appearance-controls__field" for="big-point-color">
            <span>Big points</span>
            <input id="big-point-color" type="color" value="#ff0000">
          </label>
          <label class="appearance-controls__field" for="starting-point-color">
            <span>Starting point</span>
            <input id="starting-point-color" type="color" value="#ff0000">
          </label>
        </div>
      </details>
      <section class="rotation-controls" aria-labelledby="rotation-controls-title">
        <h2 id="rotation-controls-title" class="rotation-controls__title">ROTATION</h2>
        <label class="rotation-controls__axis" for="rotation-x">
          <span>X</span>
          <input id="rotation-x" type="range" min="-180" max="180" step="0.1" value="8.6">
          <output id="rotation-x-value" for="rotation-x">8.6&deg;</output>
        </label>
        <label class="rotation-controls__axis" for="rotation-y">
          <span>Y</span>
          <input id="rotation-y" type="range" min="-180" max="180" step="0.1" value="-11.5">
          <output id="rotation-y-value" for="rotation-y">-11.5&deg;</output>
        </label>
        <label class="rotation-controls__axis" for="rotation-z">
          <span>Z</span>
          <input id="rotation-z" type="range" min="-180" max="180" step="0.1" value="0">
          <output id="rotation-z-value" for="rotation-z">0.0&deg;</output>
        </label>
      </section>
      <div class="export-toolbar" role="group" aria-label="Export text">
        <span class="export-toolbar__label">EXPORT</span>
        <button id="export-svg" type="button">SVG</button>
        <button id="export-png" type="button">PNG</button>
        <button id="export-stl" type="button">STL</button>
        <button id="export-obj" type="button">OBJ</button>
      </div>
    </main>
    <script src="sketch.js"></script>
  </body>
</html>
