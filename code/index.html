<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="libraries/p5.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/generative-design/Code-Package-p5.js@master/libraries/gg-dep-bundle/gg-dep-bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/0.7.3/opentype.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />

  </head>
  <body>
    <main>
      <aside class="glyph-picker" aria-label="Choose a glyph">
        <h1 class="glyph-picker__title">GLYPHS</h1>
        <div id="glyph-buttons" class="glyph-picker__grid" role="group" aria-label="Font glyphs"></div>
      </aside>
      <div class="export-toolbar" role="group" aria-label="Export text">
        <span class="export-toolbar__label">EXPORT</span>
        <button id="export-svg" type="button">SVG</button>
        <button id="export-png" type="button">PNG</button>
        <button id="export-stl" type="button">STL</button>
        <button id="export-obj" type="button">OBJ</button>
      </div>
    </main>
    <script src="sketch.js"></script>
  </body>
</html>
